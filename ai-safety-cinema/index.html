<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Safety Cinema</title>
<meta name="description" content="The most important conversation of our century. Watch. Understand. Decide." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" />
<style>
:root{--bg:#05060a;--bg2:#0b0d14;--amb:#ffb547;--cy:#4fe3ff;--tx:#eceef4;--mu:#a3abbd;--gl:#101219;--bd:rgba(255,255,255,.1);--r:16px;--serif:"Fraunces",Georgia,serif;--ui:"Inter",system-ui,sans-serif;--max:1200px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 var(--ui);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.1;text-wrap:balance}
img{display:block;max-width:100%}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(5,6,10,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.nav .wrap{display:flex;align-items:center;gap:16px;height:60px}
html{background:var(--bg)}
.logo{display:flex;align-items:center;min-height:44px;font-family:var(--serif);font-weight:800;letter-spacing:.08em;font-size:15px;white-space:nowrap}
.logo span{color:var(--amb)}
.links{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.links a{padding:8px 10px;border-radius:999px;font-size:13px;color:var(--mu);transition:.2s}
.links a:hover,.links a.on{color:var(--tx);background:var(--gl)}
.links a.on{box-shadow:inset 0 0 0 1px rgba(255,181,71,.35)}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--bd);border-radius:10px;width:44px;height:44px;cursor:pointer;font-size:18px}
@media(max-width:980px){.burger{display:block}.links{display:none;position:absolute;top:60px;left:0;right:0;flex-direction:column;background:rgba(5,6,10,.97);padding:12px 24px 20px;border-bottom:1px solid var(--bd)}.nav.open .links{display:flex}.links a{padding:12px;font-size:15px}}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:999px;border:1px solid var(--bd);background:var(--gl);cursor:pointer;font-weight:500;transition:.25s}
.btn:hover{border-color:var(--cy);box-shadow:0 0 24px rgba(79,227,255,.25)}
.btn.amb{background:var(--amb);color:#130c00;border-color:var(--amb)}
.btn.amb:hover{box-shadow:0 0 32px rgba(255,181,71,.5)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:13px}
.btn.on{border-color:var(--amb);color:var(--amb)}
/* hero */
.hero{position:relative;min-height:92vh;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;animation:zoom 40s ease-in-out infinite alternate}
@keyframes zoom{to{transform:scale(1.15)}}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2;mix-blend-mode:screen}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,6,10,.2),rgba(5,6,10,.35) 45%,var(--bg))}
.hero .wrap{padding-bottom:9vh;width:100%}
.kicker{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--cy);margin:0 0 14px}
.hero h1{font-size:clamp(48px,10vw,128px);font-weight:800;letter-spacing:-.02em;text-shadow:0 0 60px rgba(255,181,71,.35)}
.hero h1 em{font-style:normal;color:var(--amb)}
.tag{font-family:var(--serif);font-size:clamp(20px,2.6vw,30px);font-style:italic;margin:18px 0 6px;max-width:28ch}
.sub{color:var(--mu);max-width:56ch;font-size:17px;margin:0 0 28px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* sections */
.sec{padding:72px 0}
.ph{padding:64px 0 24px}
.ph h1{font-size:clamp(40px,7vw,84px);font-weight:800;letter-spacing:-.02em}
.ph p{color:var(--mu);max-width:60ch;font-size:17px}
.h2{font-size:clamp(28px,4vw,44px);margin-bottom:24px}
.glow-a{color:var(--amb)}.glow-c{color:var(--cy)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{padding:24px;border-radius:var(--r);background:var(--gl);border:1px solid var(--bd)}
.stat b{display:block;font-family:var(--serif);font-size:clamp(36px,5vw,56px);font-weight:800;color:var(--amb);text-shadow:0 0 30px rgba(255,181,71,.35)}
.stat:nth-child(even) b{color:var(--cy);text-shadow:0 0 30px rgba(79,227,255,.35)}
.stat span{color:var(--mu);font-size:13px;text-transform:uppercase;letter-spacing:.12em}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{position:relative;border-radius:var(--r);background:linear-gradient(160deg,#13151d,#0b0d13);border:1px solid var(--bd);overflow:hidden;transition:transform .3s,box-shadow .3s,border-color .3s;backdrop-filter:blur(8px);display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);border-color:rgba(79,227,255,.45);box-shadow:0 10px 40px rgba(79,227,255,.12),0 0 0 1px rgba(255,181,71,.12)}
.th{position:relative;display:block;aspect-ratio:16/9;background:#111;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .th img{transform:scale(1.05)}
.len{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);font-size:12px;padding:2px 7px;border-radius:6px}
.cb{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font-size:18px}
.cb h3 a:hover{color:var(--amb)}
.meta{color:var(--mu);font-size:13px;margin:0}
.stars{color:var(--amb);margin:0;letter-spacing:2px;font-size:13px}
.why{margin:0;font-size:14px}
.acts{display:flex;gap:12px;align-items:center;margin-top:auto;padding-top:8px}
.wl{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mu);cursor:pointer;min-height:36px}
.wl input{accent-color:var(--amb);width:18px;height:18px}
.list .card{flex-direction:row}
.list{grid-template-columns:1fr}
.list .th{width:240px;flex:none}
@media(max-width:600px){.list .th{width:130px}.list .why{display:none}}
/* timeline */
.lvl{margin-bottom:56px}
.lvh{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between;margin-bottom:24px}
.bar{height:6px;border-radius:9px;background:var(--gl);overflow:hidden;width:min(320px,100%)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amb),var(--cy));box-shadow:0 0 12px var(--cy);transition:width .6s}
.prog{font-size:13px;color:var(--mu)}
.tl{position:relative;padding-left:36px;display:grid;gap:20px}
.tl:before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:linear-gradient(var(--amb),var(--cy));box-shadow:0 0 14px var(--cy)}
.tl>.card:before{content:"";position:absolute}
.tl .node{position:absolute;left:-32px;top:24px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--amb);box-shadow:0 0 12px var(--amb)}
.tl .item{position:relative}
.tl .card{flex-direction:row}
.tl .th{width:280px;flex:none}
@media(max-width:700px){.tl .card{flex-direction:column}.tl .th{width:100%}}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tile{padding:24px;border-radius:var(--r);border:1px solid var(--bd);background:var(--gl);transition:.3s}
.tile:hover{border-color:var(--amb);box-shadow:0 0 30px rgba(255,181,71,.18);transform:translateY(-3px)}
.tile h3{font-size:22px;margin-bottom:6px}
.tile p{margin:0;color:var(--mu);font-size:14px}
.today{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:center}
.today .th{border-radius:var(--r);box-shadow:0 0 60px rgba(79,227,255,.18)}
@media(max-width:800px){.today{grid-template-columns:1fr}}
/* reveal */
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.hero>img{animation:none}}
/* players */
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;box-shadow:0 0 80px rgba(79,227,255,.12)}
.player iframe,.player>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.poster{position:absolute;inset:0;display:block}
.poster img{width:100%;height:100%;object-fit:cover;opacity:.75}
.poster b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;background:var(--amb);color:#130c00;display:grid;place-items:center;font-size:30px;box-shadow:0 0 50px rgba(255,181,71,.6);transition:.3s}
.poster:hover b{transform:translate(-50%,-50%) scale(1.1)}
.wgrid{display:grid;grid-template-columns:1fr 340px;gap:32px;margin-top:28px}
@media(max-width:900px){.wgrid{grid-template-columns:1fr}}
.panel{padding:22px;border-radius:var(--r);background:var(--gl);border:1px solid var(--bd);margin-bottom:20px}
.panel h3{font-size:20px;margin-bottom:10px}
.panel ul{margin:0;padding-left:20px}
.mom{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--bd);padding:12px 0;cursor:pointer;min-height:44px}
.mom:hover .mt{box-shadow:0 0 14px var(--cy)}
.mt{flex:none;font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--cy);color:var(--cy);height:fit-content;font-variant-numeric:tabular-nums}
.mini{display:flex;gap:12px;align-items:center;padding:8px 0}
.mini img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:none}
.mini span{font-size:14px;line-height:1.35}
.mini:hover span{color:var(--amb)}
.yt{font-size:12px;color:var(--mu);text-decoration:underline}
/* theater */
.theater{background:#000;min-height:100vh;padding:24px 0 60px}
.tbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
select,input[type=search]{min-height:44px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:8px 14px}
input[type=search]{flex:1;min-width:200px}
.tgrid{display:grid;grid-template-columns:1fr 340px;gap:20px}
.tgrid.closed{grid-template-columns:1fr}.tgrid.closed .tlist{display:none}
.tlist{max-height:72vh;overflow:auto;border:1px solid var(--bd);border-radius:var(--r);padding:8px}
.tlist button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:6px;cursor:pointer}
.tlist button:hover{background:var(--gl)}
.tlist button.cur{background:#231c10;box-shadow:inset 3px 0 0 var(--amb)}
.tlist img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;flex:none}
.tlist small{display:block;color:var(--mu)}
.tlist .wd{color:var(--cy)}
@media(max-width:900px){.tgrid{grid-template-columns:1fr}.tlist{max-height:50vh}}
body.lights .nav,body.lights footer,body.lights .tbar,body.lights .tlist,body.lights #tinfo{display:none}
body.lights .tgrid{grid-template-columns:1fr}
body.lights .theater{display:flex;align-items:center;min-height:100vh;padding:0}
body.lights .player{border-radius:0;box-shadow:0 0 120px rgba(255,181,71,.08)}
.lo{position:fixed;right:16px;bottom:16px;z-index:60;display:none}
body.lights .lo{display:inline-flex;opacity:.4}body.lights .lo:hover{opacity:1}
/* ideas */
.idea{display:grid;grid-template-columns:120px 1fr;gap:24px;padding:36px;border-radius:24px;border:1px solid var(--bd);background:linear-gradient(135deg,#15120c,#0b1317);margin-bottom:24px}
.idea .n{font-family:var(--serif);font-size:88px;font-weight:800;line-height:.9;color:transparent;-webkit-text-stroke:1.5px var(--amb);text-shadow:0 0 30px rgba(255,181,71,.3)}
.idea:nth-child(even) .n{-webkit-text-stroke-color:var(--cy)}
.idea h2{font-size:clamp(22px,3vw,32px);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--gl);max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.2s}
.chip:hover{border-color:var(--cy);color:var(--cy)}
@media(max-width:700px){.idea{grid-template-columns:1fr;padding:24px}.idea .n{font-size:56px}}
.quote{font-family:var(--serif);font-style:italic;font-size:clamp(24px,3.4vw,40px);line-height:1.3;max-width:30ch;margin:24px 0 8px;border-left:3px solid var(--amb);padding-left:24px}
/* glossary */
.flip{perspective:1000px;min-height:200px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.flip .in2{position:relative;width:100%;height:100%;min-height:200px;transition:transform .6s;transform-style:preserve-3d}
.flip.f .in2{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--bd);padding:22px;display:flex;flex-direction:column;justify-content:center;background:var(--gl)}
.flip .fa h3{font-size:26px}
.flip .fa small{color:var(--mu);margin-top:8px}
.flip .fb{transform:rotateY(180deg);background:linear-gradient(135deg,#0d1d24,#19150e);font-size:14px}
.flip:hover .fa{border-color:var(--amb);box-shadow:0 0 24px rgba(255,181,71,.15)}
/* quiz */
.qz{max-width:760px}
.qopt{display:block;width:100%;text-align:left;padding:16px 18px;margin:10px 0;border-radius:14px;border:1px solid var(--bd);background:var(--gl);cursor:pointer;min-height:44px;transition:.2s}
.qopt:hover:not(:disabled){border-color:var(--cy)}
.qopt.ok{border-color:#3ddc84;background:#0f2419}
.qopt.no{border-color:#ff5d6c;background:#2a1217}
.qopt:disabled{cursor:default}
.ring{width:160px;height:160px}
.ring .rb{fill:none;stroke:var(--gl);stroke-width:10}
.ring .rf{fill:none;stroke:url(#rg);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.2s}
.ring .rt{fill:var(--tx);font:700 26px var(--serif)}
.ring .rs{fill:var(--mu);font:12px var(--ui)}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px;text-align:center}
.rings h3{font-size:18px;margin-top:8px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:99;width:100%;height:100%}
footer{border-top:1px solid var(--bd);padding:32px 0 48px;color:var(--mu);font-size:13px;margin-top:40px}
footer .t{font-family:var(--serif);font-style:italic;color:var(--tx);font-size:18px;margin:0 0 8px}
.empty{color:var(--mu);padding:40px 0}
</style>
</head>
<body>
<header class="nav" id="nav"><div class="wrap">
<a class="logo" href="#/">AI SAFETY <span>CINEMA</span></a>
<button class="burger" id="burger" aria-label="Menu" aria-expanded="false">☰</button>
<nav class="links" id="links"></nav>
</div></header>
<img id="heroSrc" src="hero.jpg" alt="" hidden>
<main id="app"></main>
<footer><div class="wrap">
<p class="t">Watch. Understand. Decide.</p>
<p>Curated by Aniruddha Adak · AI AGI ASI · Ratings are editorial; views as of Oct 2026; upload dates approximate.</p>
</div></footer>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb547"/><stop offset="1" stop-color="#4fe3ff"/></linearGradient></defs></svg>
<script src="s0.js"></script><script src="s1.js"></script><script src="s1b.js"></script>
<script src="s2.js"></script>
</body>
</html>
